<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>Mixes</title>
  <meta name="description" content="Music for working." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-info" id="header-info"></div>
    <a class="home-link" id="home-link" href="/" data-nav hidden>&larr; All mixes</a>
  </header>

  <main class="grid" id="grid"></main>
  <main class="mix-page" id="mix-page" hidden></main>
  <div class="spacer"></div>

  <!-- Player -->
  <div class="progress" id="progress">
    <div class="progress-buffer" id="progress-buffer"></div>
    <div class="progress-fill" id="progress-fill"></div>
    <input class="progress-slider" id="seek" type="range" min="0" max="1000" value="0" aria-label="seek" />
  </div>

  <section class="player" id="player">
    <div class="player-bar">
      <div class="controls">
        <button type="button" id="prev" aria-label="previous">
          <svg width="13" height="12" viewBox="0 0 13 12"><rect x="0" y="0" width="1.6" height="12" /><path d="M12 0V12L3 6Z" /></svg>
        </button>
        <button type="button" id="play" aria-label="play">
          <svg class="icon-play" width="13" height="14" viewBox="0 0 13 14"><path d="M0 0L13 7L0 14Z" /></svg>
          <svg class="icon-pause" width="12" height="14" viewBox="0 0 12 14"><rect width="4" height="14" /><rect x="8" width="4" height="14" /></svg>
        </button>
        <button type="button" id="next" aria-label="next">
          <svg width="13" height="12" viewBox="0 0 13 12"><path d="M1 0V12L10 6Z" /><rect x="11.4" y="0" width="1.6" height="12" /></svg>
        </button>
        <p class="now-title" id="now-title"></p>
      </div>
      <div class="options">
        <span class="share-msg" id="share-msg" aria-live="polite"></span>
        <button type="button" id="share" aria-label="copy link to this mix" title="Copy link to this mix" hidden>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M6.6 9.4l2.8-2.8" /><path d="M7.3 4.4l1.3-1.3a2.6 2.6 0 0 1 3.7 3.7L11 8.1" /><path d="M8.7 11.6l-1.3 1.3a2.6 2.6 0 0 1-3.7-3.7L5 7.9" /></svg>
        </button>
        <button type="button" id="toggle-info" aria-label="show info">
          <svg class="chevron" id="chevron" width="16" height="9" viewBox="0 0 16 9" fill="none"><path d="M1 8L8 1.5L15 8" stroke="currentColor" stroke-width="1.4" /></svg>
        </button>
        <p class="tabular time"><span id="time-cur">0:00:00</span> of <span id="time-dur">0:00:00</span></p>
      </div>
    </div>

    <div class="drawer">
      <div class="drawer-info">
        <p id="drawer-name">Nothing playing yet</p>
        <p class="drawer-desc" id="drawer-desc">Press play on any mix.</p>
      </div>
      <div class="cover-col"><img id="drawer-cover" alt="" /></div>
    </div>
  </section>

  <audio id="audio" preload="none"></audio>
  <script src="/app.js"></script>
</body>
</html>
