# Cloudflare Worker config.
# "name" must match the Worker's name in the Cloudflare dashboard.
name = "mixes"
main = "src/worker.js"
compatibility_date = "2025-01-01"
# Keep variables added in the dashboard when deploying from git.
keep_vars = true

# The static site (HTML, CSS, JS, placeholder covers/audio).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/media/*", "/mix/*"]

# Uploaded audio, covers and the mix list.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "mixes"
